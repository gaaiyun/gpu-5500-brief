name: 每日情报采集与发布

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notify:
        description: '强制推送钉钉与微信（测试用，不受每日一次限制）'
        type: boolean
        default: false
      scheduled:
        description: '按每日定时任务处理（外部定时器使用，每个渠道当天只推一次）'
        type: boolean
        default: false
  issues:
    # A quote filed through the form shows on the site within minutes; it reaches the group with the next daily push.
    types: [opened, edited, closed, reopened, labeled]
  schedule:
    # 16:35 UTC = next day 00:35 Asia/Shanghai. GitHub often starts scheduled jobs hours late or drops one,
    # so two backups follow; data/push_log.json keeps each channel to one push per day.
    - cron: '35 16 * * *'
    - cron: '7 18 * * *'
    - cron: '13 22 * * *'

permissions:
  contents: write
  pages: write
  id-token: write
  issues: read

concurrency:
  group: gpu-5500-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, '报价')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # Queued runs start from the newest main, not the commit that triggered them.
          ref: main
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei fonts-noto-cjk
      - name: Verify evidence handling
        run: python -m unittest discover -s tests -v
      - name: Sweep the web for new intelligence
        # Merges the cloud routine's checked feed when its branch exists, then runs the CI sweep with Workers AI.
        # Any failure leaves the committed data/feed.json in place.
        continue-on-error: true
        timeout-minutes: 6
        env:
          GPU_AI_ENDPOINT: ${{ vars.GPU_AI_ENDPOINT }}
          GPU_AI_TOKEN: ${{ secrets.GPU_AI_TOKEN }}
        run: |
          if git fetch --depth=1 origin claude/intel-feed 2>/dev/null && git show FETCH_HEAD:data/feed.json > /tmp/cloud_feed.json; then
            python scripts/sweep.py --cloud /tmp/cloud_feed.json
          else
            python scripts/sweep.py
          fi
      - name: Collect sources and review forecast
        id: collect
        continue-on-error: true
        env:
          GPU_AI_ENDPOINT: ${{ vars.GPU_AI_ENDPOINT }}
          GPU_AI_TOKEN: ${{ secrets.GPU_AI_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python scripts/update.py
      - name: Preserve daily collection records
        run: |
          git config user.name 'gaaiyun'
          git config user.email 'gaaiyun@users.noreply.github.com'
          bash scripts/publish_data.sh 'chore(情报): 更新来源状态与每日预测复核' data/state.json data/history data/feed.json
      - name: Build website and report
        run: python scripts/build.py
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Push daily image to DingTalk
        # Code pushes only republish the site. Scheduled runs and their backups send once a day; a manual notify run always sends.
        if: github.event_name == 'schedule' || inputs.scheduled || inputs.notify
        env:
          DINGTALK_WEBHOOK: ${{ secrets.DINGTALK_WEBHOOK }}
          DINGTALK_SECRET: ${{ secrets.DINGTALK_SECRET }}
          FORCE: ${{ inputs.notify }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$(python scripts/push_log.py check dingtalk)" = "sent" ]; then
            echo "DingTalk already received today's report"; exit 0
          fi
          python scripts/notify_dingtalk.py
          python scripts/push_log.py record dingtalk
      - name: Push daily report to WeChat (PushPlus)
        # Runs even when the DingTalk push failed, so one channel outage does not silence the other.
        if: (github.event_name == 'schedule' || inputs.scheduled || inputs.notify) && !cancelled()
        env:
          PUSHPLUS_TOKEN: ${{ secrets.PUSHPLUS_TOKEN }}
          PUSHPLUS_TOPIC: ${{ vars.PUSHPLUS_TOPIC }}
          FORCE: ${{ inputs.notify }}
        run: |
          if [ "$FORCE" != "true" ] && [ "$(python scripts/push_log.py check pushplus)" = "sent" ]; then
            echo "WeChat group already received today's report"; exit 0
          fi
          python scripts/notify_pushplus.py
          python scripts/push_log.py record pushplus
      - name: Record today's pushes
        # A backup run then retries only the channel that failed.
        if: (github.event_name == 'schedule' || inputs.scheduled || inputs.notify) && !cancelled()
        run: |
          [ -f data/push_log.json ] || exit 0
          bash scripts/publish_data.sh 'chore(推送): 记录当日日报推送' data/push_log.json
      - name: Fail visibly after publishing outage state
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Source collection failed. The site now displays the failure state and preserved evidence.'
          exit 1
