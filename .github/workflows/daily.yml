name: 每日情报采集与发布

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 16:35 UTC = next day 00:35 Asia/Shanghai. GitHub may delay scheduled jobs.
    - cron: '35 16 * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: gpu-5500-pages
  cancel-in-progress: false

jobs:
  update-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - name: Install report dependencies
        run: |
          python -m pip install -r requirements.txt
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-wqy-zenhei
      - name: Verify evidence handling
        run: python -m unittest discover -s tests -v
      - name: Collect sources and review forecast
        id: collect
        continue-on-error: true
        run: python scripts/update.py
      - name: Preserve daily collection records
        run: |
          git config user.name 'gaaiyun'
          git config user.email 'gaaiyun@users.noreply.github.com'
          git add data/state.json data/history
          if ! git diff --cached --quiet; then
            git commit -m 'chore(情报): 更新来源状态与每日预测复核'
            git push origin HEAD:main
          fi
      - name: Build website and report
        run: python scripts/build.py
      - name: Setup Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Upload Pages
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: dist
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
      - name: Fail visibly after publishing outage state
        if: steps.collect.outcome == 'failure'
        run: |
          echo 'Source collection failed. The site now displays the failure state and preserved evidence.'
          exit 1
